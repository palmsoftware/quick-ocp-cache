name: Build and Push Cache Images

on:
  schedule:
    - cron: '0 2 * * 0'  # Weekly, Sunday 02:00 UTC
  workflow_dispatch:
    inputs:
      ocp_version:
        description: 'Single OCP version to build (leave empty to build all from pins)'
        required: false
        default: ''
      force_rebuild:
        description: 'Rebuild even if the registry image is already current'
        required: false
        default: 'false'
        type: boolean
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - 'scripts/**'
      - '.github/workflows/build-cache.yml'

concurrency:
  group: build-cache-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: quay.io
  IMAGE: bapalm/quick-ocp-cache
  PINS_URL: https://raw.githubusercontent.com/palmsoftware/quick-ocp/main/crc-version-pins.json

jobs:
  determine-versions:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve versions from crc-version-pins.json
        id: resolve
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          PINS=$(curl -fsSL --retry 5 --retry-delay 3 "${{ env.PINS_URL }}")

          # Fetch the release list once so every matrix cell resolves against
          # the same data. resolve-crc-release.sh mirrors the runtime
          # resolution in quick-ocp (per-minor, newest by published date) and
          # returns "crc_version<TAB>bundle_version" — the bundle z-version is
          # the one embedded in that CRC release.
          export RELEASES_FILE=$(mktemp)
          trap 'rm -f "${RELEASES_FILE}"' EXIT
          curl -fsSL --retry 5 --retry-delay 3 \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            "https://api.github.com/repos/crc-org/crc/releases?per_page=100" > "${RELEASES_FILE}"

          if [ -n "${{ github.event.inputs.ocp_version }}" ]; then
            # Single version requested via workflow_dispatch
            VERSIONS="${{ github.event.inputs.ocp_version }}"
          else
            # All versions from pins (excluding "latest" which is a pointer, not a real OCP version)
            VERSIONS=$(echo "${PINS}" | jq -r '.version_pins | keys[] | select(. != "latest")')
          fi

          MATRIX_FILE=$(mktemp)
          echo "[]" > "${MATRIX_FILE}"

          while IFS= read -r OCP; do
            [ -n "${OCP}" ] || continue
            PIN=$(echo "${PINS}" | jq -r --arg v "${OCP}" '.version_pins[$v] // "auto"')

            if [ "${PIN}" = "auto" ]; then
              RESOLVED=$(scripts/resolve-crc-release.sh --minor "${OCP}") \
                || { echo "::error::Failed to resolve CRC release for OCP ${OCP}"; exit 1; }
            else
              RESOLVED=$(scripts/resolve-crc-release.sh --minor "${OCP}" --pin "${PIN}") \
                || { echo "::error::Failed to resolve CRC release for OCP ${OCP}"; exit 1; }
            fi
            CRC=$(printf '%s' "${RESOLVED}" | cut -f1)
            BUNDLE=$(printf '%s' "${RESOLVED}" | cut -f2)

            if [ -z "${CRC}" ]; then
              if [ "${PIN}" = "auto" ]; then
                # No CRC release serves this minor yet — building an image
                # anyway would embed a CRC binary for a different minor.
                echo "::warning::No CRC release currently serves OCP ${OCP} — skipping image build for this minor"
                continue
              else
                echo "::error::Pinned CRC ${PIN} does not exist or does not serve OCP ${OCP}"
                exit 1
              fi
            fi

            echo "OCP ${OCP}: pin=${PIN} crc=${CRC} bundle=${BUNDLE}"

            jq --arg ocp "${OCP}" --arg crc "${CRC}" --arg bundle "${BUNDLE}" \
              '. + [{ocp_version: $ocp, crc_version: $crc, bundle_version: $bundle}]' \
              "${MATRIX_FILE}" > "${MATRIX_FILE}.tmp"
            mv "${MATRIX_FILE}.tmp" "${MATRIX_FILE}"
          done <<< "${VERSIONS}"

          # GITHUB_OUTPUT key=value entries must be single-line — emit the
          # matrix as compact JSON (jq's default output is pretty-printed).
          echo "matrix=$(jq -c . "${MATRIX_FILE}")" >> "$GITHUB_OUTPUT"
          echo "Resolved matrix:"
          jq . "${MATRIX_FILE}"

  build-amd64:
    needs: determine-versions
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.determine-versions.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Login to Quay.io
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Check if amd64 image needs rebuilding
        id: check
        env:
          REPOSITORY: ${{ env.IMAGE }}
          TAG: ${{ matrix.ocp_version }}-amd64
          DESIRED_CRC_VERSION: ${{ matrix.crc_version }}
          DESIRED_BUNDLE_VERSION: ${{ matrix.bundle_version }}
          FORCE_REBUILD: ${{ github.event.inputs.force_rebuild }}
        run: scripts/check-image-drift.sh

      - name: Free disk space
        if: steps.check.outputs.rebuilt == 'true'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          df -h

      - name: Prepare build cache directory
        if: steps.check.outputs.rebuilt == 'true'
        run: mkdir -p .build-cache

      - name: Build amd64 image
        if: steps.check.outputs.rebuilt == 'true'
        run: |
          docker build \
            --platform linux/amd64 \
            --build-arg OCP_VERSION="${{ matrix.ocp_version }}" \
            --build-arg CRC_VERSION="${{ matrix.crc_version }}" \
            --build-arg BUNDLE_VERSION="${{ matrix.bundle_version }}" \
            --label "ocp_version=${{ matrix.ocp_version }}" \
            --label "crc_version=${{ matrix.crc_version }}" \
            --label "bundle_version=${{ matrix.bundle_version }}" \
            --progress=plain \
            -t "${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ matrix.ocp_version }}-amd64" \
            .

      - name: Push amd64 image
        if: steps.check.outputs.rebuilt == 'true'
        uses: nick-fields/retry@v4.0.0
        with:
          max_attempts: 3
          timeout_minutes: 15
          retry_wait_seconds: 30
          command: |
            docker push "${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ matrix.ocp_version }}-amd64"

  build-arm64:
    needs: determine-versions
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.determine-versions.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Login to Quay.io
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Check if arm64 image needs rebuilding
        id: check
        env:
          REPOSITORY: ${{ env.IMAGE }}
          TAG: ${{ matrix.ocp_version }}-arm64
          DESIRED_CRC_VERSION: ${{ matrix.crc_version }}
          DESIRED_BUNDLE_VERSION: ${{ matrix.bundle_version }}
          FORCE_REBUILD: ${{ github.event.inputs.force_rebuild }}
        run: scripts/check-image-drift.sh

      - name: Free disk space
        if: steps.check.outputs.rebuilt == 'true'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          df -h

      - name: Prepare build cache directory
        if: steps.check.outputs.rebuilt == 'true'
        run: mkdir -p .build-cache

      - name: Build arm64 image
        if: steps.check.outputs.rebuilt == 'true'
        run: |
          docker build \
            --platform linux/arm64 \
            --build-arg OCP_VERSION="${{ matrix.ocp_version }}" \
            --build-arg CRC_VERSION="${{ matrix.crc_version }}" \
            --build-arg BUNDLE_VERSION="${{ matrix.bundle_version }}" \
            --label "ocp_version=${{ matrix.ocp_version }}" \
            --label "crc_version=${{ matrix.crc_version }}" \
            --label "bundle_version=${{ matrix.bundle_version }}" \
            --progress=plain \
            -t "${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ matrix.ocp_version }}-arm64" \
            .

      - name: Push arm64 image
        if: steps.check.outputs.rebuilt == 'true'
        uses: nick-fields/retry@v4.0.0
        with:
          max_attempts: 3
          timeout_minutes: 15
          retry_wait_seconds: 30
          command: |
            docker push "${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ matrix.ocp_version }}-arm64"

  # Manifest lists are cheap to re-create (registry API calls only, no image
  # pulls), so this always runs and re-points each tag at the current arch
  # manifests — no skip logic that could freeze a stale manifest in place.
  create-manifest:
    needs:
      - determine-versions
      - build-amd64
      - build-arm64
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.determine-versions.outputs.matrix) }}
    steps:
      - name: Login to Quay.io
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Create and push OCP version manifest
        uses: nick-fields/retry@v4.0.0
        with:
          max_attempts: 3
          timeout_minutes: 10
          retry_wait_seconds: 30
          command: |
            OCP_TAG="${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ matrix.ocp_version }}"

            docker manifest create --amend "${OCP_TAG}" \
              "${OCP_TAG}-amd64" \
              "${OCP_TAG}-arm64"

            docker manifest annotate "${OCP_TAG}" "${OCP_TAG}-amd64" --os linux --arch amd64
            docker manifest annotate "${OCP_TAG}" "${OCP_TAG}-arm64" --os linux --arch arm64

            docker manifest push "${OCP_TAG}"
            echo "Pushed ${OCP_TAG}"

      - name: Create and push CRC version manifest
        uses: nick-fields/retry@v4.0.0
        with:
          max_attempts: 3
          timeout_minutes: 10
          retry_wait_seconds: 30
          command: |
            OCP_TAG="${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ matrix.ocp_version }}"
            CRC_TAG="${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ matrix.crc_version }}"

            docker manifest create --amend "${CRC_TAG}" \
              "${OCP_TAG}-amd64" \
              "${OCP_TAG}-arm64"

            docker manifest annotate "${CRC_TAG}" "${OCP_TAG}-amd64" --os linux --arch amd64
            docker manifest annotate "${CRC_TAG}" "${OCP_TAG}-arm64" --os linux --arch arm64

            docker manifest push "${CRC_TAG}"
            echo "Pushed ${CRC_TAG}"
